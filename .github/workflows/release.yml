name: Release

on:
  push:
    branches: ["release/v*"]

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for git describe

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - uses: cachix/install-nix-action@v31

      - name: Prepare release version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#release/}
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ "$(printf '%s\n' "$VERSION" "$LATEST" | sort -V | tail -1)" != "$VERSION" ]]; then
            echo "Refusing to replace latest stable $LATEST with $VERSION" >&2
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            git merge-base --is-ancestor "$GITHUB_SHA" "$VERSION"
            git checkout --detach "$VERSION"
            test "$(cat VERSION)" = "${VERSION#v}"
          else
            printf '%s\n' "${VERSION#v}" > VERSION
            git add VERSION
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): $VERSION"
            fi
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Go and Nix release
        env:
          VERSION: ${{ steps.ver.outputs.v }}
        run: |
          test -z "$(gofmt -l *.go)"
          go test ./...
          go vet ./...
          nix build . --out-link nix-result
          test "$(nix-result/bin/token-counter --version)" = "$VERSION"

      - name: Build binaries
        env:
          VERSION: ${{ steps.ver.outputs.v }}
        run: |
          mkdir -p dist
          for GOOS in darwin linux; do
            for GOARCH in amd64 arm64; do
              GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags="-s -w -X main.version=$VERSION" \
                -o "dist/token-counter-${GOOS}-${GOARCH}" .
            done
          done
          cd dist && sha256sum * > checksums.txt

      - name: Publish immutable version tag
        env:
          VERSION: ${{ steps.ver.outputs.v }}
        run: |
          if ! git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION"
          fi
          git push origin "refs/tags/$VERSION"

      - name: Create stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: ${{ steps.ver.outputs.v }}
          generate_release_notes: true
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*

      - name: Advance stable channel after publishing
        env:
          VERSION: ${{ steps.ver.outputs.v }}
        run: |
          PREVIOUS=$(git ls-remote origin refs/tags/stable | cut -f1)
          git tag --force stable "$VERSION"
          git push "--force-with-lease=refs/tags/stable:$PREVIOUS" origin refs/tags/stable
