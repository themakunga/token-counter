name: Nightly

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build binaries
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          for GOOS in darwin linux; do
            for GOARCH in amd64 arm64; do
              GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags="-s -w -X main.version=nightly-$SHA" \
                -o "dist/token-counter-${GOOS}-${GOARCH}" .
            done
          done
          cd dist && sha256sum * > checksums.txt

      - name: Delete previous nightly release
        run: |
          gh release delete nightly --yes 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (${{ github.sha }})
          prerelease: true
          make_latest: false
          files: dist/*
          body: |
            Automated build from `main` · commit ${{ github.sha }}

            > ⚠️ Build inestable. Para uso en producción descarga una [versión estable](../../releases/latest).
